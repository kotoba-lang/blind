name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: JVM (javax.crypto)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest
      - run: clojure -M:test
      - run: clojure -M:lint

  test-cljs:
    name: shadow-cljs node-test (real ClojureScript / Web Crypto, not just .cljc-named)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest
      # Node 20+ exposes Web Crypto as the `crypto` global, which is the
      # only AEAD/HMAC primitive the cljs side of this library uses. A
      # cljs job that never actually reached `crypto.subtle` would prove
      # nothing, so this job is the one that makes the cross-runtime
      # golden vectors in test/blind/vectors.cljc mean something.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache node_modules / gitlibs
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.gitlibs
            ~/.m2
          key: ${{ runner.os }}-cljs-${{ hashFiles('package.json', 'deps.edn') }}

      - run: npm install
      # gen-shadow-cljs-edn.cljs resolves `clojure -Spath` (the SAME
      # deps.edn dependency set `clojure -M:test` uses) into
      # shadow-cljs.edn's :source-paths, so this always tests against the
      # exact pinned versions -- never a hand-duplicated, driftable list.
      - run: npm run test:cljs
